<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="xmasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A091A"/>
      <stop offset="40%" stop-color="#881337"/>
      <stop offset="80%" stop-color="#38040E"/>
      <stop offset="100%" stop-color="#1F0207"/>
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#xmasBg)"/>

  <!-- Ornate Corner Accents -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.6">
    <rect x="30" y="30" width="540" height="740" rx="8"/>
    <rect x="36" y="36" width="528" height="728" rx="4" stroke-dasharray="4 8"/>
    <!-- Top-Left Corner Flower -->
    <circle cx="30" cy="30" r="10"/>
    <circle cx="570" cy="30" r="10"/>
    <circle cx="30" cy="770" r="10"/>
    <circle cx="570" cy="770" r="10"/>
  </g>

  <!-- Ambient Golden Glow -->
  <circle cx="300" cy="420" r="240" fill="#F59E0B" opacity="0.12" filter="url(#goldGlow)"/>

  <!-- Snowfall Particles Bokeh -->
  <g fill="#FFF" opacity="0.4">
    <circle cx="100" cy="120" r="3"/>
    <circle cx="480" cy="160" r="4"/>
    <circle cx="160" cy="280" r="2.5"/>
    <circle cx="440" cy="310" r="5" opacity="0.6"/>
    <circle cx="80" cy="450" r="3.5"/>
    <circle cx="520" cy="490" r="3"/>
    <circle cx="140" cy="620" r="4"/>
    <circle cx="460" cy="640" r="2"/>
    <circle cx="220" cy="180" r="5" fill="#FDE047" opacity="0.5"/>
    <circle cx="380" cy="220" r="3" fill="#FDE047" opacity="0.6"/>
  </g>

  <!-- Top Metadata -->
  <text x="300" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#FDE047" text-anchor="middle" letter-spacing="4">SPECIAL HOLIDAY CAMPAIGN</text>

  <!-- Big Badge -->
  <g transform="translate(230, 110)">
    <rect width="140" height="30" rx="15" fill="url(#goldGrad)"/>
    <text x="70" y="20" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="12" fill="#3B0714" text-anchor="middle" letter-spacing="2">UP TO 50% OFF</text>
  </g>

  <!-- Main Headline Typography -->
  <text x="300" y="200" font-family="'Outfit', 'Syne', serif" font-weight="900" font-size="64" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MERRY</text>
  <text x="300" y="260" font-family="'Outfit', 'Syne', serif" font-weight="900" font-size="76" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2" filter="url(#goldGlow)">CHRISTMAS</text>

  <!-- Stylized Geometric Vector Christmas Tree -->
  <g transform="translate(300, 310)">
    <!-- Glowing Star at the Top -->
    <path d="M 0,-40 L 9,-18 L 32,-18 L 14,-4 L 20,18 L 0,6 L -20,18 L -14,-4 L -32,-18 L -9,-18 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
    
    <!-- Tier 1 (Top) -->
    <polygon points="0,-15 50,45 -50,45" fill="url(#emeraldGrad)"/>
    <polygon points="0,-15 0,45 50,45" fill="#047857" opacity="0.5"/>

    <!-- Tier 2 (Middle) -->
    <polygon points="0,30 85,110 -85,110" fill="url(#emeraldGrad)"/>
    <polygon points="0,30 0,110 85,110" fill="#047857" opacity="0.5"/>

    <!-- Tier 3 (Bottom) -->
    <polygon points="0,95 125,190 -125,190" fill="url(#emeraldGrad)"/>
    <polygon points="0,95 0,190 125,190" fill="#047857" opacity="0.5"/>

    <!-- Trunk -->
    <rect x="-16" y="190" width="32" height="35" rx="4" fill="#78350F"/>

    <!-- Tree Ornaments -->
    <circle cx="-25" cy="25" r="7" fill="#EF4444" filter="url(#goldGlow)"/>
    <circle cx="20" cy="35" r="6" fill="#FDE047"/>
    <circle cx="-50" cy="90" r="8" fill="#FDE047"/>
    <circle cx="35" cy="80" r="9" fill="#EF4444" filter="url(#goldGlow)"/>
    <circle cx="-10" cy="70" r="6" fill="#60A5FA"/>
    <circle cx="-75" cy="165" r="9" fill="#EF4444"/>
    <circle cx="65" cy="160" r="8" fill="#FDE047" filter="url(#goldGlow)"/>
    <circle cx="-15" cy="150" r="7" fill="#F43F5E"/>
    <circle cx="20" cy="140" r="8" fill="#60A5FA"/>

    <!-- Garland ribbons -->
    <path d="M -35,35 Q 0,55 35,40" fill="none" stroke="#FDE047" stroke-width="2.5" stroke-dasharray="3 3"/>
    <path d="M -65,95 Q 0,130 65,100" fill="none" stroke="#FDE047" stroke-width="3" stroke-dasharray="4 4"/>
    <path d="M -100,175 Q 0,220 100,180" fill="none" stroke="#FDE047" stroke-width="3.5" stroke-dasharray="5 5"/>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(300, 620)">
    <text x="0" y="0" font-family="'Outfit', sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">FESTIVE SALE 2024</text>
    <text x="0" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#FCD34D" text-anchor="middle">EXCLUSIVE HOLIDAY COLLECTIONS • DECEMBER 20 - 31</text>
  </g>

  <!-- Adobe Illustrator Attribution Badge -->
  <g transform="translate(225, 715)">
    <rect width="150" height="24" rx="5" fill="rgba(245, 158, 11, 0.15)" stroke="#F59E0B" stroke-width="1"/>
    <text x="75" y="16" font-family="'Space Grotesk', monospace" font-weight="700" font-size="10" fill="#F59E0B" text-anchor="middle">ADOBE ILLUSTRATOR</text>
  </g>
</svg>
