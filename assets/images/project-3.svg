<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="motionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="glowPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#motionBg)"/>
  
  <!-- Video Timeline & Player Interface Mockup -->
  <g transform="translate(80, 50)">
    <!-- Video Player Window -->
    <rect width="640" height="340" rx="18" fill="#0B0F19" stroke="#4C1D95" stroke-width="2"/>
    <!-- Top bar -->
    <rect width="640" height="36" rx="18" fill="#18181B"/>
    <circle cx="24" cy="18" r="6" fill="#EF4444"/>
    <circle cx="44" cy="18" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="18" r="6" fill="#10B981"/>
    <text x="320" y="23" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">al-jazeera-kinetic-broadcast-comp.aep</text>
    
    <!-- Video Canvas Center -->
    <rect x="25" y="55" width="590" height="200" rx="10" fill="#030712"/>
    <!-- Motion graphic kinetic elements -->
    <path d="M 50 160 Q 200 70 350 140 T 590 100" fill="none" stroke="url(#glowPink)" stroke-width="5"/>
    <circle cx="200" cy="100" r="40" fill="none" stroke="#EC4899" stroke-width="2" opacity="0.6"/>
    <circle cx="200" cy="100" r="60" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="6,6"/>
    
    <!-- Big Kinetic Headline inside video -->
    <text x="340" y="130" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF">KINETIC PULSE</text>
    <text x="340" y="160" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#F43F5E" letter-spacing="4">BROADCAST INTRO • 60 FPS</text>
    
    <!-- Play Button Overlay -->
    <circle cx="100" cy="140" r="32" fill="url(#glowPink)"/>
    <polygon points="94,126 112,140 94,154" fill="#FFFFFF"/>

    <!-- Bottom Timeline Track -->
    <rect x="25" y="270" width="590" height="50" rx="8" fill="#18181B"/>
    <line x1="35" y1="285" x2="605" y2="285" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <line x1="35" y1="285" x2="340" y2="285" stroke="#EC4899" stroke-width="6" stroke-linecap="round"/>
    <circle cx="340" cy="285" r="8" fill="#FFFFFF"/>
    <!-- Keyframe diamonds -->
    <polygon points="120,285 125,280 130,285 125,290" fill="#F59E0B"/>
    <polygon points="220,285 225,280 230,285 225,290" fill="#F59E0B"/>
    <polygon points="460,285 465,280 470,285 465,290" fill="#F59E0B"/>
    
    <text x="40" y="310" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8">00:14:22 / 00:30:00</text>
    <text x="540" y="310" font-family="Arial, sans-serif" font-size="10" fill="#EC4899">4K ULTRA HD</text>
  </g>

  <text x="40" y="470" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="1">AL JAZEERA • COMMERCIAL MOTION & VIDEO EDITING</text>
</svg>
