<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="reelsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="50%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="reelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#833AB4"/>
      <stop offset="50%" stop-color="#FD1D1D"/>
      <stop offset="100%" stop-color="#FCB045"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#reelsBg)"/>
  
  <!-- 2 Vertical Phone Reels Frames (9:16) -->
  <g transform="translate(160, 60)">
    <rect width="210" height="370" rx="28" fill="#000000" stroke="url(#reelGrad)" stroke-width="3"/>
    <rect x="15" y="15" width="180" height="340" rx="20" fill="#1C1917"/>
    <!-- Reel Content -->
    <circle cx="105" cy="120" r="45" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <text x="105" y="128" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#F59E0B" text-anchor="middle">🌿</text>
    <text x="105" y="195" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">VEDAYUR</text>
    <text x="105" y="215" font-family="Arial, sans-serif" font-size="11" fill="#A8A29E" text-anchor="middle">AYURVEDIC HEALING</text>
    
    <rect x="25" y="240" width="160" height="26" rx="13" fill="#059669"/>
    <text x="105" y="258" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">Organic Living Campaign</text>
    <!-- Reel UI Overlays -->
    <text x="105" y="320" font-family="Arial, sans-serif" font-size="10" fill="#E7E5E4" text-anchor="middle">🎵 Trending Audio • 1.2M Views</text>
  </g>

  <g transform="translate(430, 80)">
    <rect width="210" height="350" rx="28" fill="#000000" stroke="#71717A" stroke-width="2"/>
    <rect x="15" y="15" width="180" height="320" rx="20" fill="#0A0A0A"/>
    <!-- Kinetic Typography Reel -->
    <text x="25" y="90" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#E11D48">KINETIC</text>
    <text x="25" y="125" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF">MOTION</text>
    <text x="25" y="160" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#F59E0B">EFFECTS</text>
    
    <!-- Sound wave animation bars -->
    <rect x="25" y="220" width="8" height="40" rx="4" fill="#3B82F6"/>
    <rect x="40" y="200" width="8" height="60" rx="4" fill="#6366F1"/>
    <rect x="55" y="190" width="8" height="70" rx="4" fill="#EC4899"/>
    <rect x="70" y="210" width="8" height="50" rx="4" fill="#10B981"/>
    <rect x="85" y="195" width="8" height="65" rx="4" fill="#F59E0B"/>
    <rect x="100" y="225" width="8" height="35" rx="4" fill="#06B6D4"/>
    
    <text x="25" y="295" font-family="Arial, sans-serif" font-size="10" fill="#71717A">CapCut & Premiere Pro Edit</text>
  </g>

  <text x="40" y="470" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="1">VEDAYUR • ANIMATED SOCIAL REELS & VIDEO EDITING</text>
</svg>
