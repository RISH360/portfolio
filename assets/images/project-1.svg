<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="neon1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad1)"/>
  <circle cx="700" cy="80" r="140" fill="#38BDF8" opacity="0.15" filter="url(#glow1)"/>
  <circle cx="100" cy="420" r="180" fill="#818CF8" opacity="0.12" filter="url(#glow1)"/>
  
  <!-- UI Mockup Cards -->
  <!-- Left Phone Card -->
  <g transform="translate(140, 60)">
    <rect width="240" height="400" rx="30" fill="#0B0F19" stroke="#334155" stroke-width="3"/>
    <!-- Phone notch / header -->
    <rect x="75" y="12" width="90" height="18" rx="9" fill="#1E293B"/>
    <!-- App UI Content -->
    <rect x="20" y="50" width="200" height="90" rx="16" fill="url(#neon1)"/>
    <text x="35" y="85" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#FFFFFF">PREMIER LEAGUE</text>
    <text x="35" y="110" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF">LIVE MATCH 3 - 2</text>
    <circle cx="185" cy="95" r="22" fill="#FFFFFF" opacity="0.25"/>
    
    <!-- Player Stats cards -->
    <rect x="20" y="155" width="200" height="65" rx="14" fill="#1E293B"/>
    <circle cx="45" cy="188" r="18" fill="#38BDF8"/>
    <text x="75" y="182" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#F8FAFC">Top Striker Card</text>
    <text x="75" y="200" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Formation 4-3-3 • 94 SPD</text>

    <rect x="20" y="230" width="200" height="65" rx="14" fill="#1E293B"/>
    <circle cx="45" cy="263" r="18" fill="#818CF8"/>
    <text x="75" y="257" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#F8FAFC">Team Comparison</text>
    <text x="75" y="275" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Possession 62% vs 38%</text>

    <!-- Bottom Nav -->
    <rect x="20" y="325" width="200" height="48" rx="24" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <circle cx="50" cy="349" r="12" fill="#38BDF8"/>
    <circle cx="100" cy="349" r="10" fill="#64748B"/>
    <circle cx="140" cy="349" r="10" fill="#64748B"/>
    <circle cx="190" cy="349" r="10" fill="#64748B"/>
  </g>

  <!-- Right Phone / Detail Mockup -->
  <g transform="translate(420, 90)">
    <rect width="250" height="370" rx="30" fill="#0B0F19" stroke="#38BDF8" stroke-width="2" opacity="0.95"/>
    <rect x="80" y="12" width="90" height="18" rx="9" fill="#1E293B"/>
    <text x="30" y="65" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#F8FAFC">Tactical Formation</text>
    <text x="30" y="85" font-family="Arial, sans-serif" font-size="12" fill="#38BDF8">Interactive Pitch View</text>
    
    <!-- Pitch graphic -->
    <rect x="25" y="105" width="200" height="230" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="125" cy="220" r="35" fill="none" stroke="#34D399" stroke-width="1.5"/>
    <line x1="25" y1="220" x2="225" y2="220" stroke="#34D399" stroke-width="1.5"/>
    <!-- Player dots -->
    <circle cx="125" cy="310" r="8" fill="#FBBF24"/>
    <circle cx="65" cy="270" r="8" fill="#38BDF8"/>
    <circle cx="185" cy="270" r="8" fill="#38BDF8"/>
    <circle cx="95" cy="210" r="8" fill="#38BDF8"/>
    <circle cx="155" cy="210" r="8" fill="#38BDF8"/>
    <circle cx="125" cy="140" r="8" fill="#F43F5E"/>
  </g>
  
  <text x="40" y="470" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="1">KICKOFF PRO • UI/UX DESIGN</text>
</svg>
