<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="partyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F051D"/>
      <stop offset="35%" stop-color="#1E0A3C"/>
      <stop offset="70%" stop-color="#0D031A"/>
      <stop offset="100%" stop-color="#05010A"/>
    </linearGradient>

    <!-- Neon Gradients -->
    <linearGradient id="neonPinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E93"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>

    <linearGradient id="laserCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#00BBF9"/>
    </linearGradient>

    <linearGradient id="glowSphere" x1="30%" y1="30%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="50%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#partyBg)"/>

  <!-- Geometric Grid & Laser Lines -->
  <g opacity="0.25" stroke="#00F5D4" stroke-width="0.8">
    <line x1="40" y1="0" x2="40" y2="800"/>
    <line x1="560" y1="0" x2="560" y2="800"/>
    <line x1="0" y1="70" x2="600" y2="70"/>
    <line x1="0" y1="730" x2="600" y2="730"/>
    <!-- Diagonal Lasers -->
    <line x1="0" y1="200" x2="600" y2="500" stroke="#FF007F" stroke-width="1.5" filter="url(#neonGlow)"/>
    <line x1="600" y1="150" x2="0" y2="600" stroke="#00F5D4" stroke-width="1.5" filter="url(#neonGlow)"/>
    <line x1="100" y1="0" x2="500" y2="800" stroke="#A855F7" stroke-width="0.75"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="300" cy="400" r="220" fill="#FF007F" opacity="0.12" filter="url(#intenseGlow)"/>
  <circle cx="150" cy="280" r="140" fill="#00F5D4" opacity="0.1" filter="url(#intenseGlow)"/>
  <circle cx="480" cy="520" r="160" fill="#7928CA" opacity="0.18" filter="url(#intenseGlow)"/>

  <!-- Center Graphic 3D Orb with Wireframe Rings -->
  <g transform="translate(300, 390)">
    <!-- Outer Rings -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="#FF007F" stroke-width="2" opacity="0.6" filter="url(#neonGlow)"/>
    <ellipse cx="0" cy="0" rx="170" ry="60" fill="none" stroke="#00F5D4" stroke-width="1.8" transform="rotate(-25)" opacity="0.8" filter="url(#neonGlow)"/>
    <ellipse cx="0" cy="0" rx="170" ry="60" fill="none" stroke="#FFDE59" stroke-width="1.2" transform="rotate(35)" opacity="0.6"/>
    <!-- Glowing Sphere -->
    <circle cx="0" cy="0" r="105" fill="url(#glowSphere)"/>
    <!-- Specular highlight on sphere -->
    <ellipse cx="-35" cy="-35" rx="40" ry="25" fill="#FFFFFF" opacity="0.25" transform="rotate(-30, -35, -35)"/>
  </g>

  <!-- Equalizer / Sound Wave Graphic -->
  <g transform="translate(140, 480)" fill="url(#neonPinkGrad)">
    <rect x="0" y="0" width="8" height="60" rx="4"/>
    <rect x="18" y="-20" width="8" height="100" rx="4"/>
    <rect x="36" y="-10" width="8" height="80" rx="4"/>
    <rect x="54" y="-35" width="8" height="130" rx="4" fill="#00F5D4"/>
    <rect x="72" y="-50" width="8" height="160" rx="4" fill="#00F5D4"/>
    <rect x="90" y="-30" width="8" height="120" rx="4"/>
    <rect x="108" y="-15" width="8" height="90" rx="4"/>
    <rect x="126" y="-40" width="8" height="140" rx="4" fill="#00F5D4"/>
    <rect x="144" y="-25" width="8" height="110" rx="4"/>
    <rect x="162" y="-10" width="8" height="80" rx="4"/>
    <rect x="180" y="-45" width="8" height="150" rx="4" fill="#FFDE59"/>
    <rect x="198" y="-60" width="8" height="180" rx="4" fill="#FFDE59"/>
    <rect x="216" y="-35" width="8" height="130" rx="4"/>
    <rect x="234" y="-15" width="8" height="90" rx="4"/>
    <rect x="252" y="-30" width="8" height="120" rx="4" fill="#00F5D4"/>
    <rect x="270" y="-10" width="8" height="80" rx="4"/>
    <rect x="288" y="0" width="8" height="60" rx="4"/>
    <rect x="306" y="-20" width="8" height="100" rx="4"/>
  </g>

  <!-- Top Header Metadata -->
  <text x="50" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#00F5D4" letter-spacing="3">NEON PULSE PRODUCTIONS</text>
  <text x="550" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#94A3B8" text-anchor="end" letter-spacing="2">LIMITED ENTRY 2024</text>

  <!-- Big Floating Event Tag -->
  <g transform="translate(50, 110)">
    <rect width="130" height="28" rx="6" fill="rgba(255, 46, 147, 0.2)" stroke="#FF2E93" stroke-width="1.5"/>
    <text x="65" y="19" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">NIGHT CLUB</text>
  </g>

  <!-- Mega Typographic Title -->
  <text x="50" y="210" font-family="'Outfit', 'Syne', sans-serif" font-weight="900" font-size="88" fill="#FFFFFF" letter-spacing="-2">PARTY</text>
  <text x="50" y="270" font-family="'Outfit', 'Syne', sans-serif" font-weight="800" font-size="44" fill="url(#neonPinkGrad)" letter-spacing="1" filter="url(#neonGlow)">WEEKEND LIVE</text>
  <text x="50" y="315" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="18" fill="#00F5D4" letter-spacing="6">FEATURING INTERNATIONAL DJS</text>

  <!-- Bottom Details & Editorial Metadata -->
  <g transform="translate(50, 680)">
    <!-- Date & Time Card -->
    <text x="0" y="0" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF">SATURDAY • 10 PM</text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#94A3B8">CYBER LOUNGE ARENA • SECTOR 07</text>
    
    <!-- Minimalist Barcode on Right -->
    <g transform="translate(380, -25)" fill="#FFFFFF" opacity="0.85">
      <rect x="0" y="0" width="3" height="40"/>
      <rect x="6" y="0" width="6" height="40"/>
      <rect x="15" y="0" width="2" height="40"/>
      <rect x="20" y="0" width="5" height="40"/>
      <rect x="28" y="0" width="2" height="40"/>
      <rect x="33" y="0" width="7" height="40"/>
      <rect x="43" y="0" width="3" height="40"/>
      <rect x="49" y="0" width="5" height="40"/>
      <rect x="57" y="0" width="2" height="40"/>
      <rect x="62" y="0" width="8" height="40"/>
      <rect x="73" y="0" width="3" height="40"/>
      <rect x="79" y="0" width="6" height="40"/>
      <rect x="88" y="0" width="2" height="40"/>
      <rect x="93" y="0" width="7" height="40"/>
      <rect x="103" y="0" width="4" height="40"/>
      <text x="55" y="52" font-family="monospace" font-size="9" text-anchor="middle" fill="#94A3B8">8492049102</text>
    </g>
  </g>

  <!-- Adobe Photoshop Attribution Badge -->
  <g transform="translate(50, 755)">
    <rect width="155" height="22" rx="4" fill="rgba(49, 168, 255, 0.15)" stroke="#31A8FF" stroke-width="1"/>
    <text x="77" y="15" font-family="'Space Grotesk', monospace" font-weight="700" font-size="10" fill="#31A8FF" text-anchor="middle">ADOBE PHOTOSHOP ART</text>
  </g>
</svg>
